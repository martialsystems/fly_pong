[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-pong"
version = "0.1.0"
description = "T4/T5 + centering returns vs lag. Placement is closed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Martial Systems LLC" }]
dependencies = [
  "gymnasium>=0.29.1",
  "pygame>=2.5.2",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
train = [
  "stable-baselines3>=2.3.0",
  "torch",
  "onnx",
  "onnxruntime",
]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["fly_pong"]

[tool.setuptools.package-data]
fly_pong = ["assets/*.png", "assets/*.wav", "assets/src/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
